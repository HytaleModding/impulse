name: Bug report
description: Report a reproducible Impulse bug
title: "bug: "
labels: ["bug"]
body:
  - type: input
    id: impulse-version
    attributes:
      label: Impulse version or commit
    validations:
      required: true
  - type: input
    id: hytale-version
    attributes:
      label: Hytale server version
      placeholder: "0.6.0-pre.2"
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Backend
      placeholder: "impulse:bullet or impulse:rapier"
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include commands, world setup, and expected behavior.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation already run
      placeholder: "./gradlew headlessTest"
  - type: textarea
    id: runtime-reproduction
    attributes:
      label: Runtime reproduction
      description: If this is a runtime/server bug, include the focused regression test or describe the manual runAllMods scenario.
      placeholder: "Example: runAllMods, create space --backend=impulse:rapier, spawn the failing entity state, then unload/reload the affected plugin."
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack traces
      render: text
